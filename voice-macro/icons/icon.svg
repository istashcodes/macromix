<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Macro Ring Accents -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#accent-grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="350 900" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#primary-grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="260 990" stroke-dashoffset="-400" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-dasharray="180 1070" stroke-dashoffset="-700" />

  <!-- Glow Backdrop -->
  <circle cx="256" cy="256" r="90" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Center Floating Microphone -->
  <g transform="translate(0, -10)">
    <!-- Mic Body -->
    <rect x="206" y="140" width="100" height="170" rx="50" fill="url(#primary-grad)" />
    
    <!-- Mic Arc Stand -->
    <path d="M 166 230 A 90 90 0 0 0 346 230" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />
    
    <!-- Mic Base Pole & Foot -->
    <line x1="256" y1="320" x2="256" y2="380" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />
    <line x1="196" y1="380" x2="316" y2="380" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />

    <!-- Mic Inner Grid / Sound Waves -->
    <line x1="230" y1="190" x2="282" y2="190" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="222" y1="220" x2="290" y2="220" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="230" y1="250" x2="282" y2="250" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
