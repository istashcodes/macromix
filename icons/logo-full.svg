<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 38" width="162" height="38" class="brand-logo-svg" role="img" aria-label="macromix logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
      .font-header-black {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
      }
    </style>
  </defs>
  <!-- Concentric Rings centered at cx=18, cy=19 -->
  <circle cx="18" cy="19" r="16.5" fill="none" stroke="#F6BA3B" stroke-width="3.2"/>
  <circle cx="18" cy="19" r="12.4" fill="none" stroke="#F0631E" stroke-width="3"/>
  <circle cx="18" cy="19" r="8.3" fill="none" stroke="#D6293A" stroke-width="2.8"/>
  
  <!-- 'm' in Inter 900 starting at center cx=18 and ending at outer border x=34.5 -->
  <text x="18" y="25.5" 
        class="font-header-black" font-size="18.5" letter-spacing="-0.4px"
        fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">m</text>
  <text x="18" y="25.5" 
        class="font-header-black" font-size="18.5" letter-spacing="-0.4px"
        fill="#111111">m</text>

  <!-- 'acromix' in Inter 900 -->
  <text x="36.5" y="25.5" 
        class="font-header-black" font-size="18.5" letter-spacing="-0.4px">
    <tspan fill="#111111">acro</tspan><tspan fill="#F05A46">mix</tspan>
  </text>
</svg>