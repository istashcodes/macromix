<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
      .font-inter-black {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
      }
    </style>
  </defs>
  <rect width="512" height="512" fill="#FFFFFF"/>
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Concentric Rings centered at cx=228, cy=256 -->
    <g id="rings">
      <circle cx="228" cy="256" r="196" fill="none" stroke="#F6BA3B" stroke-width="34"/>
      <circle cx="228" cy="256" r="148" fill="none" stroke="#F0631E" stroke-width="32"/>
      <circle cx="228" cy="256" r="98" fill="none" stroke="#D6293A" stroke-width="30"/>
    </g>
    <!-- 'm' in Inter 900 starting at center cx=228 and ending at outer border x=424 -->
    <g id="letter-m">
      <text x="228" y="348" 
            class="font-inter-black" font-size="265" letter-spacing="-5px"
            fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round">m</text>
      <text x="228" y="348" 
            class="font-inter-black" font-size="265" letter-spacing="-5px"
            fill="#111111">m</text>
    </g>
  </g>
</svg>