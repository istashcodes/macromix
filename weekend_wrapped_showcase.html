  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-border: 3.5px solid #111111;
      --card-shadow: 5px 5px 0px #111111;
      --yellow: #FFE600;
      --pink: #FF3366;
      --lime: #00F59B;
      --purple: #A855F7;
      --orange: #FF6B00;
      --cyan: #00F0FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 230, 0, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 245, 155, 0.12) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #111;
      padding: 16px;
      overflow-x: hidden;
    }

    /* User Switcher Bar */
    .user-switcher-bar {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 2px solid #334155;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    .user-tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .user-tab-btn.active {
      background: var(--yellow);
      color: #111;
      box-shadow: 2px 2px 0 #111;
    }

    /* Mobile Phone Shell */
    .story-viewport {
      width: 100%;
      max-width: 410px;
      height: 740px;
      max-height: calc(100vh - 90px);
      position: relative;
      border-radius: 36px;
      border: 5px solid #1e293b;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #000;
      cursor: pointer;
    }

    /* Top Progress Bars */
    .progress-bar-container {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 100;
    }
    .progress-segment {
      flex: 1;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    /* Story Meta Header */
    .story-meta-header {
      position: absolute;
      top: 28px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.85);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }
    .user-avatar {
      width: 24px;
      height: 24px;
      background: var(--yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      border: 1.5px solid #111;
    }
    .user-handle {
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }
    .story-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-btn {
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Tap Zone Overlays */
    .tap-zone {
      position: absolute;
      top: 70px;
      bottom: 75px;
      z-index: 50;
    }
    .tap-zone.left {
      left: 0;
      width: 40%;
    }
    .tap-zone.right {
      right: 0;
      width: 60%;
    }

    /* Slides Deck */
    .slides-deck {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 18px;
      padding: 80px 22px 30px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(12px);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      z-index: 10;
    }

    /* Slide Themes */
    .slide-1 { background: linear-gradient(170deg, #FFE600 0%, #FF8A00 100%); }
    .slide-2 { background: linear-gradient(165deg, #FF6B00 0%, #FF3366 100%); color: #fff; }
    .slide-3 { background: linear-gradient(175deg, #00F59B 0%, #00B4D8 100%); }
    .slide-4 { background: linear-gradient(160deg, #A855F7 0%, #4338CA 100%); color: #fff; }
    .slide-5 { background: linear-gradient(170deg, #FF3366 0%, #7928CA 100%); color: #fff; }
    .slide-6 { background: linear-gradient(180deg, #00F0FF 0%, #0051FF 100%); color: #fff; }
    .slide-7 { background: #0f172a; color: #fff; justify-content: center; gap: 20px; }

    /* Neo-Brutalist Components */
    .brutal-card {
      background: #ffffff;
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 20px;
      padding: 16px;
      color: #111;
      position: relative;
    }
    .brutal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: var(--card-border);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #111;
    }
    .font-grotesk { font-family: 'Space Grotesk', sans-serif; }
    .stat-hero-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .sub-hero-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Bottom Action Bar */
    .story-bottom-action {
      position: absolute;
      bottom: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .share-pill-btn {
      flex: 1;
      background: #111;
      color: #FFE600;
      border: 2.5px solid #FFE600;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.6);
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .share-pill-btn.secondary {
      flex: 0 0 46px;
      background: #fff;
      color: #111;
      border: 2.5px solid #111;
      padding: 0;
    }

    .toast-msg {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111;
      color: #FFE600;
      border: 2px solid #FFE600;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    function playTone(freq, type, duration) {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function updateSlideUI() {
      const slides = Array.from(document.querySelectorAll('#slidesDeck .slide'));
      slides.forEach((s, idx) => {
        if (idx === currentSlide) s.classList.add('active');
        else s.classList.remove('active');
      });

      fills.forEach((fill, idx) => {
        if (!fill) return;
        if (idx < currentSlide) {
          fill.style.transition = 'none';
          fill.style.width = '100%';
        } else if (idx > currentSlide) {
          fill.style.transition = 'none';
          fill.style.width = '0%';
        }
      });
      playTone(440 + (currentSlide * 60), 'triangle', 0.22);
    }

    function startSlideProgress() {
      cancelAnimationFrame(slideTimer);
      slideStartTime = Date.now() - slideElapsed;
      function tick() {
        if (isPaused) return;
        const now = Date.now();
        const elapsed = now - slideStartTime;
        const pct = Math.min(100, (elapsed / SLIDE_DURATION_MS) * 100);
        if (fills[currentSlide]) {
          fills[currentSlide].style.transition = 'width 0.1s linear';
          fills[currentSlide].style.width = `${pct}%`;
        }
        if (elapsed >= SLIDE_DURATION_MS) {
          if (currentSlide < TOTAL_SLIDES - 1) {
            goToSlide(currentSlide + 1);
          } else {
            isPaused = true;
            pauseBtn.textContent = '▶';
          }
        } else {
          slideTimer = requestAnimationFrame(tick);
        }
      }
      slideTimer = requestAnimationFrame(tick);
    }

    function goToSlide(targetIdx) {
      if (targetIdx < 0) targetIdx = 0;
      if (targetIdx >= TOTAL_SLIDES) targetIdx = TOTAL_SLIDES - 1;
      currentSlide = targetIdx;
      slideElapsed = 0;
      updateSlideUI();
      startSlideProgress();
    }

    function togglePause() {
      isPaused = !isPaused;

      if (!isPaused) {
        slideStartTime = Date.now() - slideElapsed;
        startSlideProgress();
      } else {
        slideElapsed = Date.now() - slideStartTime;
      }
    }

    document.getElementById('tapLeft').addEventListener('click', (e) => { e.stopPropagation(); if (currentSlide > 0) goToSlide(currentSlide - 1); });
    document.getElementById('tapRight').addEventListener('click', (e) => { e.stopPropagation(); if (currentSlide < TOTAL_SLIDES - 1) goToSlide(currentSlide + 1); });
    document.getElementById('prevSlideBtn').addEventListener('click', (e) => { e.stopPropagation(); if (currentSlide > 0) goToSlide(currentSlide - 1); });
    document.getElementById('nextSlideBtn').addEventListener('click', (e) => { e.stopPropagation(); if (currentSlide < TOTAL_SLIDES - 1) goToSlide(currentSlide + 1); });
    document.getElementById('quickShareBtn').addEventListener('click', (e) => { e.stopPropagation(); triggerShare(); });
    pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      showToast(soundEnabled ? 'Audio On' : 'Audio Muted');
    });

    // Press & hold
    const phoneShell = document.getElementById('storyViewport');
    let pressTimer = null;
    phoneShell.addEventListener('mousedown', () => { pressTimer = setTimeout(() => { isPaused = true; pauseBtn.textContent = '▶'; }, 180); });
    phoneShell.addEventListener('mouseup', () => { clearTimeout(pressTimer); if (isPaused) { isPaused = false; pauseBtn.textContent = '⏸'; startSlideProgress(); } });

    // Keydown
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { if (currentSlide < TOTAL_SLIDES - 1) goToSlide(currentSlide + 1); }
      else if (e.key === 'ArrowLeft') { if (currentSlide > 0) goToSlide(currentSlide - 1); }
      else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePause(); }
    });

    // Init
    renderUserSlides(currentUser);
    goToSlide(0);
  </script>
</body>
</html>
