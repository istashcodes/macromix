name: Deploy macromix to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Gemini Mobile Coder"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject Gemini API Key into env.js
        run: |
          cat << 'EOF' > env.js
          window.__ENV = {
            GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          };
          EOF

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy --only hosting --project macro-streak-tracker --token "${{ secrets.FIREBASE_TOKEN }}"
